function normalizar(txt) {
  return (txt || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9ñ]+/g," ")
    .trim();
}
function escapar(txt) {
  return String(txt)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function buscar() {
  const q = normalizar(document.getElementById("q").value);
  const status = document.getElementById("status");
  const box = document.getElementById("results");

  if (q.length < 2) {
    status.textContent = "";
    box.innerHTML = '<div class="empty">Escribe al menos 2 letras para buscar.</div>';
    return;
  }

  const tokens = q.split(/\s+/).filter(Boolean);
  const encontrados = estudiantes.filter(e => {
    const n = normalizar(e.nombre);
    return tokens.every(t => n.includes(t));
  }).slice(0,30);

  if (!encontrados.length) {
    status.textContent = "Sin coincidencias";
    box.innerHTML = '<div class="empty">No encontramos ese nombre. Revisa la escritura o intenta con menos palabras.</div>';
    return;
  }

  status.textContent = encontrados.length === 1
    ? "1 estudiante encontrado"
    : encontrados.length + " estudiantes encontrados";

  box.innerHTML = encontrados.map(e => `
    <article class="result">
      <div class="name">${escapar(e.nombre)}</div>
      <div class="badges">
        <span class="badge">Grado: ${escapar(e.grado)}</span>
        ${e.curso && !e.curso.toLowerCase().startsWith("ciclo")
          ? `<span class="badge">Curso: ${escapar(e.curso)}</span>` : ""}
        <span class="badge">Categoría ${escapar(e.categoria)}</span>
        
        <span class="badge">Salón ${escapar(e.salon)}</span>
      </div>
      <div class="school">${escapar(e.colegio)}</div>
    </article>
  `).join("");
}

document.getElementById("buscar").addEventListener("click", buscar);
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") buscar();
});
document.getElementById("q").addEventListener("input", () => {
  const q = document.getElementById("q").value.trim();
  if (q.length >= 3) buscar();
  else if (!q) {
    document.getElementById("status").textContent = "";
    document.getElementById("results").innerHTML = "";
  }
});
