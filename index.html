<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de salón - Concurso Metropolitano de Matemáticas</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --primary:#17365d; --primary2:#1f4e78;
  --text:#172033; --muted:#667085; --border:#d7deea; --soft:#eaf4ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{width:min(760px,calc(100% - 28px));margin:42px auto}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:22px 22px 0 0;padding:28px 24px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(1.45rem,4vw,2rem)}
.hero p{margin:0;opacity:.93}
.card{background:var(--card);border:1px solid var(--border);border-top:0;border-radius:0 0 22px 22px;padding:24px;box-shadow:0 12px 32px rgba(23,54,93,.09)}
label{display:block;font-weight:800;margin-bottom:8px}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px}
input{width:100%;min-height:52px;border:1px solid #b9c5d6;border-radius:12px;padding:0 14px;font-size:1rem;outline:none}
input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(31,78,120,.12)}
button{min-height:52px;border:0;border-radius:12px;padding:0 22px;background:var(--primary2);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.hint{margin:9px 0 0;color:var(--muted);font-size:.92rem}
#status{margin:22px 0 10px;font-weight:800}
.result{border:1px solid var(--border);background:#fff;border-radius:14px;padding:16px;margin-top:10px}
.name{font-size:1.1rem;font-weight:900;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--soft);color:var(--primary);border-radius:999px;padding:7px 11px;font-weight:800;font-size:.92rem}
.school{color:var(--muted);margin-top:10px;font-size:.9rem}
.empty{border:1px dashed #b9c5d6;padding:18px;border-radius:12px;color:var(--muted);text-align:center}
footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:16px}
@media(max-width:560px){.wrap{margin:18px auto}.searchrow{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <h1>Consulta de categoría y salón</h1>
  <p>Concurso Metropolitano de Matemáticas</p>
</section>
<section class="card">
  <label for="q">Escribe tu nombre</label>
  <div class="searchrow">
    <input id="q" type="search" autocomplete="name" placeholder="Ej.: Juan Pérez" aria-label="Nombre del estudiante">
    <button id="buscar" type="button">Buscar</button>
  </div>
  <p class="hint">Puedes escribir el nombre completo, primer nombre y apellido, o varias partes del nombre. No importa el orden, las tildes ni las mayúsculas.</p>
  <div id="status" aria-live="polite"></div>
  <div id="results"></div>
</section>
<footer>Consulta oficial de ubicación de participantes.</footer>
</main>

function normalizar(txt) {
  return (txt || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9ñ]+/g," ")
    .trim();
}
function escapar(txt) {
  return String(txt).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function buscar() {
  const raw=document.getElementById("q").value;
  const q=normalizar(raw);
  const status=document.getElementById("status");
  const box=document.getElementById("results");

  if(q.length<2) {
    status.textContent="";
    box.innerHTML='<div class="empty">Escribe al menos 2 letras para buscar.</div>';
    return;
  }

  const tokens=q.split(/\s+/).filter(Boolean);
  const encontrados=estudiantes.filter(e=>{
    const n=normalizar(e.nombre);
    return tokens.every(t=>n.includes(t));
  }).slice(0,30);

  if(!encontrados.length) {
    status.textContent="Sin coincidencias";
    box.innerHTML='<div class="empty">No encontramos ese nombre. Revisa la escritura o intenta con menos palabras.</div>';
    return;
  }

  status.textContent=encontrados.length===1 ? "1 estudiante encontrado" : encontrados.length+" estudiantes encontrados";
  box.innerHTML=encontrados.map(e=>`
    <article class="result">
      <div class="name">${escapar(e.nombre)}</div>
      <div class="badges">
        <span class="badge">Categoría ${escapar(e.categoria)}</span>
        <span class="badge">Salón ${escapar(e.salon)}</span>
        ${e.grado ? `<span class="badge">Grado ${escapar(e.grado)}</span>` : ""}
      </div>
      <div class="school">${escapar(e.colegio)}</div>
    </article>
  `).join("");
}
document.getElementById("buscar").addEventListener("click",buscar);
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});
document.getElementById("q").addEventListener("input",()=>{
  const q=document.getElementById("q").value.trim();
  if(q.length>=3) buscar();
  else if(!q) {
    document.getElementById("status").textContent="";
    document.getElementById("results").innerHTML="";
  }
});
</script>
